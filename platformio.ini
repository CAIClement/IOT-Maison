[env:esp32dev]
; Version epinglee : arduino-esp32 3.x rend digitalWrite() avant pinMode()
; silencieusement inoperant, ce qui casserait la securite au demarrage.
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = blynkkk/Blynk@1.3.2
build_flags =
    -D BLYNK_PRINT=Serial
; Les tests unitaires tournent en natif, pas sur la carte.
test_ignore = *

[env:native]
platform = native
test_framework = unity
; Compile aussi les sources de src/ dans le binaire de test,
; en excluant main.cpp qui dépend d'Arduino.h.
test_build_src = yes
build_src_filter = +<*> -<main.cpp>
build_flags = -std=gnu++14 -Wall -Wextra
